const STORE_KEY="korean30_mobile_fixed_v1";
let state;
try {
  state=JSON.parse(localStorage.getItem(STORE_KEY)) || {unlocked:3,selected:1,dayDone:{},blockDone:{}};
} catch(e) {
  state={unlocked:3,selected:1,dayDone:{},blockDone:{}};
}
let mode="words";
let quiz=[];
let questionIndex=0;
let quizDays=[];

const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderApp(){
  $("status").textContent=`解放済み：Day 1〜${state.unlocked} / 30`;
  $("bar").style.width=(state.unlocked/30*100)+"%";
  const grid=$("dayGrid");
  grid.innerHTML="";
  DAYS.forEach((day,index)=>{
    const n=index+1;
    const b=document.createElement("button");
    b.type="button";
    b.className="day";
    if(n>state.unlocked){b.classList.add("locked");b.disabled=true}
    if(state.dayDone[n])b.classList.add("done");
    if(n===state.selected)b.classList.add("current");
    b.dataset.day=String(n);
    b.innerHTML=`<b>Day ${n}</b><br><span class="muted">${escapeHtml(day.title)}</span>`;
    grid.appendChild(b);
  });
  $("lessonTitle").textContent=`Day ${state.selected}　${DAYS[state.selected-1].title}`;
  $("graduation").classList.toggle("hidden",!state.blockDone[10]);
  setActiveTab(mode);
  renderLesson();
}

function setActiveTab(name){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.action===name));
}

function renderLesson(){
  const content=$("content");
  const day=DAYS[state.selected-1];
  content.innerHTML="";
  if(mode==="words" || mode==="sentences"){
    const items=mode==="words"?day.words:day.sentences;
    items.forEach((item,index)=>{
      const row=document.createElement("div");
      row.className="item";
      row.innerHTML=`<div class="ko">${index+1}. ${escapeHtml(item[0])}</div>
      <div class="read">${escapeHtml(item[1])}</div>
      <div class="jp">${escapeHtml(item[2])}</div>
      <button type="button" class="audio" data-speak="${encodeURIComponent(item[0])}">音声を聞く</button>`;
      content.appendChild(row);
    });
  }
}

function speak(text){
  if(!("speechSynthesis" in window)){
    alert("このブラウザでは音声再生に対応していません。SafariまたはChromeで開いてください。");
    return;
  }
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR";
  u.rate=.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function makeQuiz(dayNumbers){
  const list=[];
  dayNumbers.forEach(n=>{
    const d=DAYS[n-1];
    d.words.forEach(x=>list.push({q:x[0],r:x[1],a:x[2],pool:d.words.map(y=>y[2]),day:n,type:"単語"}));
    d.sentences.forEach(x=>list.push({q:x[0],r:x[1],a:x[2],pool:d.sentences.map(y=>y[2]),day:n,type:"例文"}));
  });
  return shuffle(list);
}

function startDayTest(){
  quizDays=[state.selected];
  quiz=makeQuiz(quizDays);
  questionIndex=0;
  mode="daytest";
  setActiveTab(mode);
  showQuestion();
}

function startBlockTest(){
  const end=Math.ceil(state.selected/3)*3;
  const start=end-2;
  if(end>state.unlocked){alert("この3日分はまだ全部解放されていません。");return}
  quizDays=[start,start+1,end];
  quiz=makeQuiz(quizDays);
  questionIndex=0;
  mode="blocktest";
  setActiveTab(mode);
  showQuestion();
}

function showQuestion(){
  if(questionIndex>=quiz.length){finishQuiz();return}
  const q=quiz[questionIndex];
  const choices=shuffle([q.a,...shuffle(q.pool.filter(x=>x!==q.a)).slice(0,3)]);
  const content=$("content");
  content.innerHTML=`<div class="muted">${questionIndex+1}/${quiz.length}　Day ${q.day}　${q.type}</div>
  <div class="ko" style="margin:18px 0">${escapeHtml(q.q)}</div>
  <div id="choices"></div><div id="feedback"></div>`;
  const box=$("choices");
  choices.forEach(choice=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="choice";
    b.dataset.answer=choice;
    b.textContent=choice;
    box.appendChild(b);
  });
}

function answerQuestion(button){
  const q=quiz[questionIndex];
  const selected=button.dataset.answer;
  const all=[...document.querySelectorAll(".choice")];
  all.forEach(b=>b.disabled=true);
  const correct=selected===q.a;
  button.classList.add(correct?"ok":"ng");
  if(!correct){
    const correctButton=all.find(b=>b.dataset.answer===q.a);
    if(correctButton)correctButton.classList.add("ok");
  }
  $("feedback").innerHTML=`
    <div class="${correct?'success':'notice'}">${correct?'正解です':'不正解です。全問正解が条件のため、最初から再挑戦します。'}</div>
    <div class="review">
      <div class="ko">${escapeHtml(q.q)}</div>
      <div class="read">${escapeHtml(q.r)}</div>
      <div class="jp">${escapeHtml(q.a)}</div>
      <button type="button" class="audio" data-speak="${encodeURIComponent(q.q)}">音声で復習</button>
    </div>
    <button type="button" class="primary" data-next="${correct?'next':'retry'}">${correct?'次の問題へ':'最初から再挑戦'}</button>`;
}

function finishQuiz(){
  if(mode==="daytest"){
    state.dayDone[state.selected]=true;
    save();
    $("content").innerHTML='<div class="success"><b>Dayテスト全15問正解です。</b><br>3日まとめテストに挑戦してください。</div>';
  } else {
    const end=Math.max(...quizDays);
    const block=end/3;
    state.blockDone[block]=true;
    quizDays.forEach(n=>state.dayDone[n]=true);
    if(end<30){
      state.unlocked=Math.min(30,end+3);
      state.selected=end+1;
      mode="words";
      save();
      renderApp();
      $("content").innerHTML=`<div class="success"><b>3日分を完全クリアしました。</b><br>Day ${end+1}〜${Math.min(30,end+3)}を解放しました。</div>`;
    } else {
      save();
      renderApp();
    }
  }
}

document.addEventListener("click",event=>{
  const dayButton=event.target.closest("[data-day]");
  if(dayButton){
    state.selected=Number(dayButton.dataset.day);
    mode="words";
    save();
    renderApp();
    return;
  }

  const tabButton=event.target.closest(".tab");
  if(tabButton){
    const action=tabButton.dataset.action;
    if(action==="words" || action==="sentences"){
      mode=action;
      setActiveTab(mode);
      renderLesson();
    } else if(action==="daytest"){
      startDayTest();
    } else if(action==="blocktest"){
      startBlockTest();
    }
    return;
  }

  const audioButton=event.target.closest("[data-speak]");
  if(audioButton){
    speak(decodeURIComponent(audioButton.dataset.speak));
    return;
  }

  const choiceButton=event.target.closest(".choice");
  if(choiceButton && !choiceButton.disabled){
    answerQuestion(choiceButton);
    return;
  }

  const nextButton=event.target.closest("[data-next]");
  if(nextButton){
    if(nextButton.dataset.next==="next"){
      questionIndex++;
      showQuestion();
    } else {
      quiz=makeQuiz(quizDays);
      questionIndex=0;
      showQuestion();
    }
  }
});

renderApp();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
